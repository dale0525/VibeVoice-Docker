name: build-and-push-tts-docker

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "Dockerfile.7b"
      - "Dockerfile.moss"
      - "Dockerfile.cosy"
      - "Dockerfile.base"
      - "Dockerfile.app"
      - "requirements.txt"
      - "app/**"
      - "scripts/**"
      - "VibeVoice/**"
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: "是否强制重建 base 镜像（依赖 + 模型大层）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  determine-models:
    name: determine-models-to-build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      has_models: ${{ steps.pick.outputs.has_models }}
      model_tags_json: ${{ steps.pick.outputs.model_tags_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select models from changed files
        id: pick
        shell: bash
        run: |
          set -euo pipefail

          NEED_15="0"
          NEED_7B="0"
          NEED_MOSS="0"
          NEED_COSY="0"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            NEED_15="1"
            NEED_7B="1"
            NEED_MOSS="1"
            NEED_COSY="1"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [[ -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
              CHANGED="$(git diff --name-only "${BEFORE}" "${AFTER}")"
            else
              CHANGED="$(git show --name-only --pretty='' "${AFTER}")"
            fi

            echo "Changed files:"
            echo "${CHANGED}"

            NEED_ALL="0"
            BASE_FILE_CHANGED="0"

            while IFS= read -r file; do
              [[ -z "${file}" ]] && continue
              case "${file}" in
                Dockerfile.app|requirements.txt)
                  NEED_ALL="1"
                  ;;
                Dockerfile.base)
                  BASE_FILE_CHANGED="1"
                  ;;
                app/*|scripts/*|VibeVoice/*)
                  NEED_ALL="1"
                  ;;
                Dockerfile)
                  NEED_15="1"
                  ;;
                Dockerfile.7b)
                  NEED_7B="1"
                  ;;
                Dockerfile.moss)
                  NEED_MOSS="1"
                  ;;
                Dockerfile.cosy)
                  NEED_COSY="1"
                  ;;
              esac
            done <<< "${CHANGED}"

            # Dockerfile.base 做细粒度判定：
            # - 仅变更模型专属分支（moss / cosy）时，只构建对应模型
            # - 触及公共区域或无法判断时，保守全量构建
            if [[ "${BASE_FILE_CHANGED}" == "1" && "${NEED_ALL}" != "1" ]]; then
              BASE_HUNKS_NEW_LINES="$(
                git diff --unified=0 "${BEFORE}" "${AFTER}" -- Dockerfile.base | \
                awk '/^@@ /{h=$3; sub(/^\+/,"",h); split(h,a,","); start=a[1]; len=(a[2]==""?1:a[2]); if (len > 0) {for (i=start; i<start+len; i++) print i}}'
              )"

              MOSS_START="$(grep -n 'if \[ "\${MODEL_ID}" = "moss-ttsd-v1.0" \]; then' Dockerfile.base | head -n1 | cut -d: -f1 || true)"
              COSY_START="$(grep -n 'elif \[ "\${MODEL_ID}" = "cosyvoice3-0.5b" \]; then' Dockerfile.base | head -n1 | cut -d: -f1 || true)"
              COSY_END=""
              if [[ "${COSY_START}" =~ ^[0-9]+$ ]]; then
                COSY_END="$(awk -v start="${COSY_START}" 'NR >= start && $0 ~ /^[[:space:]]*fi[[:space:]]*$/ {print NR; exit}' Dockerfile.base || true)"
              fi

              BASE_TOUCHED_COMMON="0"
              BASE_TOUCHED_MODEL_BLOCK="0"

              if [[ -z "${BASE_HUNKS_NEW_LINES}" ]]; then
                BASE_TOUCHED_COMMON="1"
              else
                while IFS= read -r line_no; do
                  [[ -z "${line_no}" ]] && continue
                  if [[ "${MOSS_START}" =~ ^[0-9]+$ && "${COSY_START}" =~ ^[0-9]+$ ]] \
                    && (( line_no >= MOSS_START && line_no < COSY_START )); then
                    NEED_MOSS="1"
                    BASE_TOUCHED_MODEL_BLOCK="1"
                  elif [[ "${COSY_START}" =~ ^[0-9]+$ && "${COSY_END}" =~ ^[0-9]+$ ]] \
                    && (( line_no >= COSY_START && line_no <= COSY_END )); then
                    NEED_COSY="1"
                    BASE_TOUCHED_MODEL_BLOCK="1"
                  else
                    BASE_TOUCHED_COMMON="1"
                  fi
                done <<< "${BASE_HUNKS_NEW_LINES}"
              fi

              if [[ "${BASE_TOUCHED_COMMON}" == "1" || "${BASE_TOUCHED_MODEL_BLOCK}" != "1" ]]; then
                NEED_ALL="1"
              fi
            fi

            # 保守兜底：如果 changed files 为空，默认全量构建，避免误跳过。
            if [[ -z "${CHANGED}" ]]; then
              NEED_ALL="1"
            fi

            if [[ "${NEED_ALL}" == "1" ]]; then
              NEED_15="1"
              NEED_7B="1"
              NEED_MOSS="1"
              NEED_COSY="1"
            fi
          fi

          SELECTED='[]'
          if [[ "${NEED_15}" == "1" ]]; then
            SELECTED="$(jq -c '. + [{"model_tag":"1.5b","model_id":"vibevoice-1.5b"}]' <<< "${SELECTED}")"
          fi
          if [[ "${NEED_7B}" == "1" ]]; then
            SELECTED="$(jq -c '. + [{"model_tag":"7b","model_id":"vibevoice-7b"}]' <<< "${SELECTED}")"
          fi
          if [[ "${NEED_MOSS}" == "1" ]]; then
            SELECTED="$(jq -c '. + [{"model_tag":"moss-ttsd-v1.0","model_id":"moss-ttsd-v1.0"}]' <<< "${SELECTED}")"
          fi
          if [[ "${NEED_COSY}" == "1" ]]; then
            SELECTED="$(jq -c '. + [{"model_tag":"cosyvoice3-0.5b","model_id":"cosyvoice3-0.5b"}]' <<< "${SELECTED}")"
          fi

          MATRIX="$(jq -cn --argjson include "${SELECTED}" '{include:$include}')"
          MODEL_TAGS_JSON="$(jq -cn --argjson items "${SELECTED}" '$items | map(.model_tag)')"

          if [[ "$(jq 'length' <<< "${SELECTED}")" -gt 0 ]]; then
            HAS_MODELS="true"
          else
            HAS_MODELS="false"
          fi

          echo "Selected models: ${SELECTED}"
          {
            echo "matrix=${MATRIX}"
            echo "has_models=${HAS_MODELS}"
            echo "model_tags_json=${MODEL_TAGS_JSON}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: build-and-push (${{ matrix.model_tag }})
    needs: determine-models
    if: needs.determine-models.outputs.has_models == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-models.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要 diff changed files 来判断是否重建 base 镜像
          fetch-depth: 0

      - name: Show disk usage (before cleanup)
        run: |
          df -h

      # 释放 GitHub Hosted Runner 的磁盘空间，为 VibeVoice 模型下载/镜像分层留足空间
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show disk usage (after cleanup)
        run: |
          df -h
          docker system df || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          # 每次 workflow run 自动生成递增版本号（避免依赖手动打 tag）
          # 版本号规则：v0.0.<GITHUB_RUN_NUMBER>
          VERSION="v0.0.${GITHUB_RUN_NUMBER}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/tts-docker"
          BASE_IMAGE="ghcr.io/${{ github.repository_owner }}/tts-docker-base"
          MODEL_TAG="${{ matrix.model_tag }}"
          {
            echo "image=${IMAGE}"
            echo "base_image=${BASE_IMAGE}"
            echo "base_ref=${BASE_IMAGE}:${MODEL_TAG}"
            echo "base_cache_ref=${BASE_IMAGE}:buildcache-${MODEL_TAG}"
            echo "app_cache_ref=${IMAGE}:buildcache-${MODEL_TAG}"
            echo "version=${VERSION}"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}-${MODEL_TAG}"
            echo "${IMAGE}:${MODEL_TAG}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Decide whether to rebuild base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          NEED_BASE="0"
          BASE_REF="${{ steps.vars.outputs.base_ref }}"
          CURRENT_MODEL_TAG="${{ matrix.model_tag }}"

          # base 镜像不存在时必须先构建（例如首次运行）
          if ! docker buildx imagetools inspect "${BASE_REF}" >/dev/null 2>&1; then
            NEED_BASE="1"
          fi

          # 主动触发：workflow_dispatch 可强制重建
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.rebuild_base }}" == "true" ]]; then
            NEED_BASE="1"
          fi

          # push 触发：按改动范围判定当前模型是否需要重建 base
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [[ -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
              CHANGED="$(git diff --name-only "${BEFORE}" "${AFTER}")"
            else
              CHANGED="$(git show --name-only --pretty='' "${AFTER}")"
            fi

            # requirements 与下载脚本改动会影响所有模型的 base。
            if echo "${CHANGED}" | grep -E '^(requirements\.txt|scripts/download_models\.py)$' >/dev/null; then
              NEED_BASE="1"
            fi

            # Dockerfile.base 改动：仅在触及当前模型专属分支或公共区域时重建当前模型的 base。
            if [[ "${NEED_BASE}" != "1" ]] && echo "${CHANGED}" | grep -E '^Dockerfile\.base$' >/dev/null; then
              BASE_HUNKS_NEW_LINES="$(
                git diff --unified=0 "${BEFORE}" "${AFTER}" -- Dockerfile.base | \
                awk '/^@@ /{h=$3; sub(/^\+/,"",h); split(h,a,","); start=a[1]; len=(a[2]==""?1:a[2]); if (len > 0) {for (i=start; i<start+len; i++) print i}}'
              )"

              MOSS_START="$(grep -n 'if \[ "\${MODEL_ID}" = "moss-ttsd-v1.0" \]; then' Dockerfile.base | head -n1 | cut -d: -f1 || true)"
              COSY_START="$(grep -n 'elif \[ "\${MODEL_ID}" = "cosyvoice3-0.5b" \]; then' Dockerfile.base | head -n1 | cut -d: -f1 || true)"
              COSY_END=""
              if [[ "${COSY_START}" =~ ^[0-9]+$ ]]; then
                COSY_END="$(awk -v start="${COSY_START}" 'NR >= start && $0 ~ /^[[:space:]]*fi[[:space:]]*$/ {print NR; exit}' Dockerfile.base || true)"
              fi

              BASE_TOUCHED_COMMON="0"
              BASE_TOUCHED_CURRENT_MODEL_BLOCK="0"

              if [[ -z "${BASE_HUNKS_NEW_LINES}" ]]; then
                BASE_TOUCHED_COMMON="1"
              else
                while IFS= read -r line_no; do
                  [[ -z "${line_no}" ]] && continue
                  if [[ "${MOSS_START}" =~ ^[0-9]+$ && "${COSY_START}" =~ ^[0-9]+$ ]] \
                    && (( line_no >= MOSS_START && line_no < COSY_START )); then
                    if [[ "${CURRENT_MODEL_TAG}" == "moss-ttsd-v1.0" ]]; then
                      BASE_TOUCHED_CURRENT_MODEL_BLOCK="1"
                    fi
                  elif [[ "${COSY_START}" =~ ^[0-9]+$ && "${COSY_END}" =~ ^[0-9]+$ ]] \
                    && (( line_no >= COSY_START && line_no <= COSY_END )); then
                    if [[ "${CURRENT_MODEL_TAG}" == "cosyvoice3-0.5b" ]]; then
                      BASE_TOUCHED_CURRENT_MODEL_BLOCK="1"
                    fi
                  else
                    BASE_TOUCHED_COMMON="1"
                  fi
                done <<< "${BASE_HUNKS_NEW_LINES}"
              fi

              if [[ "${BASE_TOUCHED_COMMON}" == "1" || "${BASE_TOUCHED_CURRENT_MODEL_BLOCK}" == "1" ]]; then
                NEED_BASE="1"
              fi
            fi
          fi

          # 兜底自愈：若复用了历史 cosy base，但关键依赖缺失（如 hydra），则强制重建当前模型 base。
          if [[ "${NEED_BASE}" != "1" && "${CURRENT_MODEL_TAG:-}" == "cosyvoice3-0.5b" ]]; then
            if ! docker run --rm --entrypoint python "${BASE_REF}" -c "import importlib, sys; sys.path.append('/opt/CosyVoice'); sys.path.append('/opt/CosyVoice/third_party/Matcha-TTS'); import hydra; importlib.import_module('cosyvoice.flow.flow_matching')" >/dev/null 2>&1; then
              echo "Base image ${BASE_REF} failed CosyVoice3 dependency probe; forcing base rebuild."
              NEED_BASE="1"
            fi
          fi

          echo "need_base=${NEED_BASE}" >> "${GITHUB_OUTPUT}"

      - name: Build and push base image
        if: steps.base.outputs.need_base == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          build-args: |
            USE_CN_MIRRORS=0
            PIP_INDEX_URL=https://pypi.org/simple/
            MODEL_ID=${{ matrix.model_id }}
          push: true
          tags: ${{ steps.vars.outputs.base_ref }}
          # 使用 GHCR 作为 build cache 存储，避免 GHA cache 体积/并发导致的缺 blob 问题
          cache-from: type=registry,ref=${{ steps.vars.outputs.base_cache_ref }}
          cache-to: type=registry,ref=${{ steps.vars.outputs.base_cache_ref }},mode=max

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          build-args: |
            BASE_IMAGE=${{ steps.vars.outputs.base_ref }}
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          # 使用 GHCR 作为 build cache 存储，避免 GHA cache 体积/并发导致的缺 blob 问题
          cache-from: type=registry,ref=${{ steps.vars.outputs.app_cache_ref }}
          cache-to: type=registry,ref=${{ steps.vars.outputs.app_cache_ref }},mode=max

  release:
    name: create-github-release
    needs: [determine-models, build]
    if: needs.determine-models.outputs.has_models == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          # 说明：release job 没有 checkout 仓库，因此 gh 不能通过 git remote 自动推断 repo，需要显式指定
          GH_REPO: ${{ github.repository }}
          MODEL_TAGS_JSON: ${{ needs.determine-models.outputs.model_tags_json }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.0.${GITHUB_RUN_NUMBER}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/tts-docker"

          NOTES_FILE="$(mktemp)"
          {
            echo "自动构建 Release（GitHub Actions）。"
            echo
            echo "Docker 镜像："
            jq -r --arg image "${IMAGE}" --arg tag "${TAG}" '.[] | "- \($image):\($tag)-\(.)"' <<< "${MODEL_TAGS_JSON}"
          } > "${NOTES_FILE}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release already exists: ${TAG}"
            exit 0
          fi

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}"
