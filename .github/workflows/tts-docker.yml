name: build-and-push-tts-docker

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "Dockerfile.7b"
      - "Dockerfile.cosy"
      - "Dockerfile.base"
      - "Dockerfile.app"
      - "requirements.txt"
      - "app/**"
      - "scripts/**"
      - "VibeVoice/**"
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: "是否强制重建 base 镜像（依赖 + 模型大层）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  determine-models:
    name: determine-models-to-build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      has_models: ${{ steps.pick.outputs.has_models }}
      model_tags_json: ${{ steps.pick.outputs.model_tags_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select models from changed files
        id: pick
        shell: bash
        run: |
          set -euo pipefail

          declare -A MODEL_TAG_BY_ID=(
            ["vibevoice-1.5b"]="1.5b"
            ["vibevoice-7b"]="7b"
            ["cosyvoice3-0.5b"]="cosyvoice3-0.5b"
          )
          declare -A APP_TARGET_BY_ID=(
            ["vibevoice-1.5b"]="app-vibevoice"
            ["vibevoice-7b"]="app-vibevoice"
            ["cosyvoice3-0.5b"]="app"
          )
          MODEL_IDS=(
            "vibevoice-1.5b"
            "vibevoice-7b"
            "cosyvoice3-0.5b"
          )

          declare -A SELECT_MODEL=()
          declare -A NEED_BASE_MODEL=()
          for model_id in "${MODEL_IDS[@]}"; do
            SELECT_MODEL["${model_id}"]="0"
            NEED_BASE_MODEL["${model_id}"]="0"
          done

          mark_selected() {
            local model_id="$1"
            [[ -n "${MODEL_TAG_BY_ID[$model_id]+x}" ]] || return 0
            SELECT_MODEL["${model_id}"]="1"
          }

          mark_base() {
            local model_id="$1"
            [[ -n "${MODEL_TAG_BY_ID[$model_id]+x}" ]] || return 0
            SELECT_MODEL["${model_id}"]="1"
            NEED_BASE_MODEL["${model_id}"]="1"
          }

          mark_all_selected() {
            local model_id
            for model_id in "${MODEL_IDS[@]}"; do
              mark_selected "${model_id}"
            done
          }

          mark_all_base() {
            local model_id
            for model_id in "${MODEL_IDS[@]}"; do
              mark_base "${model_id}"
            done
          }

          mark_vibevoice_selected() {
            mark_selected "vibevoice-1.5b"
            mark_selected "vibevoice-7b"
          }

          changed_new_lines() {
            local file="$1"
            if [[ -n "${BEFORE:-}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
              git diff --unified=0 "${BEFORE}" "${AFTER}" -- "${file}" | \
                awk '/^@@ /{h=$3; sub(/^\+/,"",h); split(h,a,","); start=a[1]; len=(a[2]==""?1:a[2]); if (len > 0) {for (i=start; i<start+len; i++) print i}}'
            else
              git show --unified=0 "${AFTER}" -- "${file}" | \
                awk '/^@@ /{h=$3; sub(/^\+/,"",h); split(h,a,","); start=a[1]; len=(a[2]==""?1:a[2]); if (len > 0) {for (i=start; i<start+len; i++) print i}}'
            fi
          }

          analyze_marked_file() {
            local file="$1"
            local lines="$2"
            local ranges
            ranges="$(
              awk '
                /model-block:start:/ {
                  id=$0
                  sub(/^.*model-block:start:/, "", id)
                  sub(/[[:space:]]*$/, "", id)
                  stack[id, ++count[id]] = NR
                  next
                }
                /model-block:end:/ {
                  id=$0
                  sub(/^.*model-block:end:/, "", id)
                  sub(/[[:space:]]*$/, "", id)
                  idx = count[id]
                  if (idx > 0) {
                    start = stack[id, idx]
                    if (start > 0) {
                      printf "%s %d %d\n", id, start, NR
                      stack[id, idx] = 0
                      count[id] = idx - 1
                    }
                  }
                }
              ' "${file}"
            )"

            local touched_common="0"
            local touched_models=""
            if [[ -z "${lines}" ]]; then
              touched_common="1"
            else
              while IFS= read -r line_no; do
                [[ -z "${line_no}" ]] && continue

                local in_model_block="0"
                local hit_models=""
                if [[ -n "${ranges}" ]]; then
                  while IFS=' ' read -r range_model range_start range_end; do
                    [[ -z "${range_model}" ]] && continue
                    if (( line_no >= range_start && line_no <= range_end )); then
                      in_model_block="1"
                      if ! grep -Fxq "${range_model}" <<< "${hit_models}"; then
                        hit_models="${hit_models}${range_model}"$'\n'
                      fi
                    fi
                  done <<< "${ranges}"
                fi

                if [[ "${in_model_block}" == "1" ]]; then
                  touched_models="${touched_models}${hit_models}"
                else
                  touched_common="1"
                fi
              done <<< "${lines}"
            fi

            MARKED_TOUCHED_COMMON="${touched_common}"
            MARKED_TOUCHED_MODELS="$(printf "%s" "${touched_models}" | sed '/^$/d' | sort -u || true)"
          }

          mark_base_from_marked_file() {
            local file="$1"
            local lines
            lines="$(changed_new_lines "${file}")"
            analyze_marked_file "${file}" "${lines}"
            if [[ "${MARKED_TOUCHED_COMMON}" == "1" ]]; then
              mark_all_base
              return
            fi
            while IFS= read -r touched_model; do
              [[ -z "${touched_model}" ]] && continue
              mark_base "${touched_model}"
            done <<< "${MARKED_TOUCHED_MODELS}"
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            mark_all_selected
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [[ -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
              CHANGED="$(git diff --name-only "${BEFORE}" "${AFTER}")"
            else
              CHANGED="$(git show --name-only --pretty='' "${AFTER}")"
            fi

            echo "Changed files:"
            echo "${CHANGED}"

            if [[ -z "${CHANGED}" ]]; then
              mark_all_base
            else
              while IFS= read -r file; do
                [[ -z "${file}" ]] && continue
                case "${file}" in
                  Dockerfile.app|app/*)
                    # app 层改动：所有模型都需要重建 app 层
                    mark_all_selected
                    ;;
                  VibeVoice/*)
                    # VibeVoice 源码只影响 VibeVoice 系列镜像
                    mark_vibevoice_selected
                    ;;
                  requirements.txt)
                    mark_all_base
                    ;;
                  Dockerfile.base)
                    mark_base_from_marked_file "Dockerfile.base"
                    ;;
                  scripts/download_models.py)
                    mark_base_from_marked_file "scripts/download_models.py"
                    ;;
                  scripts/*)
                    # 其他脚本改动保守处理为 app 全量
                    mark_all_selected
                    ;;
                  Dockerfile)
                    mark_selected "vibevoice-1.5b"
                    ;;
                  Dockerfile.7b)
                    mark_selected "vibevoice-7b"
                    ;;
                  Dockerfile.cosy)
                    mark_selected "cosyvoice3-0.5b"
                    ;;
                esac
              done <<< "${CHANGED}"
            fi
          fi

          SELECTED='[]'
          for model_id in "${MODEL_IDS[@]}"; do
            if [[ "${SELECT_MODEL[$model_id]}" == "1" ]]; then
              model_tag="${MODEL_TAG_BY_ID[$model_id]}"
              app_target="${APP_TARGET_BY_ID[$model_id]}"
              need_base="${NEED_BASE_MODEL[$model_id]}"
              SELECTED="$(
                jq -c \
                  --arg model_tag "${model_tag}" \
                  --arg model_id "${model_id}" \
                  --arg app_target "${app_target}" \
                  --arg need_base "${need_base}" \
                  '. + [{"model_tag":$model_tag,"model_id":$model_id,"app_target":$app_target,"need_base":$need_base}]' \
                  <<< "${SELECTED}"
              )"
            fi
          done

          MATRIX="$(jq -cn --argjson include "${SELECTED}" '{include:$include}')"
          MODEL_TAGS_JSON="$(jq -cn --argjson items "${SELECTED}" '$items | map(.model_tag)')"

          if [[ "$(jq 'length' <<< "${SELECTED}")" -gt 0 ]]; then
            HAS_MODELS="true"
          else
            HAS_MODELS="false"
          fi

          echo "Selected models: ${SELECTED}"
          {
            echo "matrix=${MATRIX}"
            echo "has_models=${HAS_MODELS}"
            echo "model_tags_json=${MODEL_TAGS_JSON}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: build-and-push (${{ matrix.model_tag }})
    needs: determine-models
    if: needs.determine-models.outputs.has_models == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-models.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show disk usage (before cleanup)
        run: |
          df -h

      # 释放 GitHub Hosted Runner 的磁盘空间，为 VibeVoice 模型下载/镜像分层留足空间
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show disk usage (after cleanup)
        run: |
          df -h
          docker system df || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          # 每次 workflow run 自动生成递增版本号（避免依赖手动打 tag）
          # 版本号规则：v0.0.<GITHUB_RUN_NUMBER>
          VERSION="v0.0.${GITHUB_RUN_NUMBER}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/tts-docker"
          BASE_IMAGE="ghcr.io/${{ github.repository_owner }}/tts-docker-base"
          MODEL_TAG="${{ matrix.model_tag }}"
          {
            echo "image=${IMAGE}"
            echo "base_image=${BASE_IMAGE}"
            echo "base_ref=${BASE_IMAGE}:${MODEL_TAG}"
            echo "base_cache_ref=${BASE_IMAGE}:buildcache-${MODEL_TAG}"
            echo "app_cache_ref=${IMAGE}:buildcache-${MODEL_TAG}"
            echo "version=${VERSION}"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}-${MODEL_TAG}"
            echo "${IMAGE}:${MODEL_TAG}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Decide whether to rebuild base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          NEED_BASE="${{ matrix.need_base }}"
          BASE_REF="${{ steps.vars.outputs.base_ref }}"
          CURRENT_MODEL_TAG="${{ matrix.model_tag }}"

          if [[ -z "${NEED_BASE}" ]]; then
            NEED_BASE="0"
          fi

          # base 镜像不存在时必须先构建（例如首次运行）
          if ! docker buildx imagetools inspect "${BASE_REF}" >/dev/null 2>&1; then
            NEED_BASE="1"
          fi

          # 主动触发：workflow_dispatch 可强制重建
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.rebuild_base }}" == "true" ]]; then
            NEED_BASE="1"
          fi

          # 兜底自愈：若复用了历史 cosy base，但关键依赖缺失（如 hydra），则强制重建当前模型 base。
          if [[ "${NEED_BASE}" != "1" && "${CURRENT_MODEL_TAG:-}" == "cosyvoice3-0.5b" ]]; then
            if ! docker run --rm --entrypoint python "${BASE_REF}" -c "import importlib, sys; sys.path.append('/opt/CosyVoice'); sys.path.append('/opt/CosyVoice/third_party/Matcha-TTS'); import hydra; importlib.import_module('cosyvoice.flow.flow_matching')" >/dev/null 2>&1; then
              echo "Base image ${BASE_REF} failed CosyVoice3 dependency probe; forcing base rebuild."
              NEED_BASE="1"
            fi
          fi

          echo "need_base=${NEED_BASE}" >> "${GITHUB_OUTPUT}"

      - name: Build and push base image
        if: steps.base.outputs.need_base == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          build-args: |
            USE_CN_MIRRORS=0
            PIP_INDEX_URL=https://pypi.org/simple/
            MODEL_ID=${{ matrix.model_id }}
          push: true
          tags: ${{ steps.vars.outputs.base_ref }}
          # 使用 GHCR 作为 build cache 存储，避免 GHA cache 体积/并发导致的缺 blob 问题
          cache-from: type=registry,ref=${{ steps.vars.outputs.base_cache_ref }}
          cache-to: type=registry,ref=${{ steps.vars.outputs.base_cache_ref }},mode=max

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          target: ${{ matrix.app_target }}
          build-args: |
            BASE_IMAGE=${{ steps.vars.outputs.base_ref }}
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          # 使用 GHCR 作为 build cache 存储，避免 GHA cache 体积/并发导致的缺 blob 问题
          cache-from: type=registry,ref=${{ steps.vars.outputs.app_cache_ref }}
          cache-to: type=registry,ref=${{ steps.vars.outputs.app_cache_ref }},mode=max

  release:
    name: create-github-release
    needs: [determine-models, build]
    if: needs.determine-models.outputs.has_models == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          # 说明：release job 没有 checkout 仓库，因此 gh 不能通过 git remote 自动推断 repo，需要显式指定
          GH_REPO: ${{ github.repository }}
          MODEL_TAGS_JSON: ${{ needs.determine-models.outputs.model_tags_json }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.0.${GITHUB_RUN_NUMBER}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/tts-docker"

          NOTES_FILE="$(mktemp)"
          {
            echo "自动构建 Release（GitHub Actions）。"
            echo
            echo "Docker 镜像："
            jq -r --arg image "${IMAGE}" --arg tag "${TAG}" '.[] | "- \($image):\($tag)-\(.)"' <<< "${MODEL_TAGS_JSON}"
          } > "${NOTES_FILE}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release already exists: ${TAG}"
            exit 0
          fi

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file "${NOTES_FILE}"
