<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TTS-Docker</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>TTS-Docker</h1>
        <div class="muted">OpenAI 兼容 TTS API + 语音克隆管理</div>
      </header>

      <section class="card">
        <h2>连接设置</h2>
        <div class="row">
          <label>
            API Key（可选）
            <input id="apiKey" type="password" placeholder="Bearer token（如启用）" />
          </label>
          <button id="saveApiKey" class="secondary">保存</button>
          <button id="clearApiKey" class="secondary">清除</button>
        </div>
        <div class="row">
          <button id="refresh" class="secondary">刷新音色列表</button>
          <div id="status" class="status muted"></div>
        </div>
      </section>

      <section class="card">
        <h2>生成语音</h2>
        <div class="grid">
          <label>
            模型（镜像已固定）
            <input id="modelDisplay" type="text" readonly />
          </label>
          <label>
            默认音色（未写 [voice_id] 时使用）
            <select id="voiceSelect"></select>
          </label>
          <label>
            格式
            <select id="formatSelect">
              <option value="wav">wav</option>
              <option value="mp3">mp3</option>
            </select>
          </label>
          <label>
            Seed（留空用后端默认）
            <input id="seedInput" type="number" min="0" step="1" placeholder="例如 42" />
          </label>
          <label>
            Temperature（0~2，留空用后端默认）
            <input id="temperatureInput" type="number" min="0" max="2" step="0.01" placeholder="例如 0.0" />
          </label>
        </div>

        <div class="mode-switch" role="tablist" aria-label="输入模式切换">
          <button id="modeVisual" class="secondary mode-btn" type="button" role="tab" aria-selected="true">
            可视化编排
          </button>
          <button id="modeScript" class="secondary mode-btn" type="button" role="tab" aria-selected="false">
            脚本模式
          </button>
          <div id="modeTip" class="muted mode-tip">可视化模式会自动序列化为 [voice_id] 脚本</div>
        </div>

        <div id="visualModePanel" class="panel-block">
          <div id="segmentEditor" class="segment-editor"></div>
          <div class="row">
            <button id="addSegment" class="secondary" type="button">新增一段</button>
            <button id="clearSegments" class="secondary" type="button">清空</button>
            <button id="exportSegmentsToScript" class="secondary" type="button">导出为脚本</button>
          </div>
          <div id="segmentSummary" class="status muted"></div>
        </div>

        <div id="scriptModePanel" class="panel-block" style="display: none">
          <label>
            脚本文本（支持 [voice_id] / Speaker N: / 普通文本）
            <textarea
              id="textInput"
              rows="8"
              placeholder="[voice_id_1]第一位说话人内容&#10;同一说话人续行&#10;[voice_id_2]第二位说话人内容"
            ></textarea>
          </label>
          <div class="row">
            <button id="insertScriptTemplate" class="secondary" type="button">插入模板</button>
            <div id="scriptParseSummary" class="status muted"></div>
          </div>
        </div>

        <div id="referenceInputs" class="grid" style="display: none">
          <label>
            参考音频（wav/mp3/flac/m4a/ogg）
            <input id="referenceVoiceFile" type="file" accept=".wav,.mp3,.flac,.m4a,.ogg" />
          </label>
          <label>
            参考音频文本（可选，CosyVoice3 推荐填写）
            <input id="referenceVoicePromptText" type="text" placeholder="例如：这是参考音频对应文本。" />
          </label>
        </div>
        <div class="row">
          <button id="generate" class="primary">生成</button>
          <a id="downloadLink" class="secondary" href="#" download style="display: none">下载</a>
        </div>
        <audio id="audioPlayer" controls style="width: 100%; margin-top: 8px"></audio>
      </section>

      <section class="card">
        <h2>音色管理</h2>
        <div class="grid">
          <label>
            新音色名称
            <input id="voiceName" type="text" placeholder="先在“参考音频”模式试听满意后再保存" />
          </label>
        </div>
        <div class="row">
          <button id="saveReferenceVoice" class="primary">保存当前参考音频为音色</button>
        </div>
        <hr style="border: none; border-top: 1px solid #2a2f3a; margin: 14px 0" />
        <div class="grid">
          <label>
            已保存音色
            <select id="manageVoiceSelect"></select>
          </label>
          <label>
            参考文本（可编辑）
            <textarea id="manageVoicePromptText" rows="3" placeholder="失焦自动保存，也可手动点击“保存参考文本”"></textarea>
          </label>
        </div>
        <div class="row">
          <button id="previewVoiceSample" class="secondary">试听参考音频</button>
          <button id="saveVoicePromptText" class="secondary">保存参考文本</button>
          <button id="deleteVoice" class="danger">删除此音色</button>
        </div>
        <audio id="voiceSamplePlayer" controls style="width: 100%; margin-top: 8px"></audio>
      </section>

      <footer class="footer muted">
        API: <code>POST /v1/audio/speech</code> / <code>/v1/audio/speech/reference</code> · 音色: <code>/v1/voices</code> · 模型: <code>/v1/models</code>
      </footer>
    </main>

    <script src="/static/input_mode_helpers.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
