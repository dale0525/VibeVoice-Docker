[workspace]
name = "tts-docker"
version = "0.1.0"
description = "TTS Docker API + Web UI"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = ">=3.10,<3.12"

[tasks]
dev = "docker buildx build --progress=plain --cache-from type=local,src=.buildx-cache --cache-to type=local,dest=.buildx-cache,mode=max --build-arg MODEL_ID=vibevoice-1.5b -t ghcr.io/dale0525/tts-docker:1.5b --load . && docker compose up"
dev-7b = "docker buildx build --progress=plain --cache-from type=local,src=.buildx-cache --cache-to type=local,dest=.buildx-cache,mode=max --build-arg MODEL_ID=vibevoice-7b -t ghcr.io/dale0525/tts-docker:7b --load . && docker compose up"
dev-cosy3 = "docker buildx build --progress=plain --cache-from type=local,src=.buildx-cache --cache-to type=local,dest=.buildx-cache,mode=max --build-arg MODEL_ID=cosyvoice3-0.5b -t ghcr.io/dale0525/tts-docker:cosyvoice3-0.5b --load . && docker compose up"
up = "docker compose up"
down = "docker compose down"
logs = "docker compose logs -f"
shell = "docker compose exec tts bash"
docker-build = "docker buildx build --progress=plain --cache-from type=local,src=.buildx-cache --cache-to type=local,dest=.buildx-cache,mode=max --build-arg MODEL_ID=vibevoice-1.5b -t ghcr.io/dale0525/tts-docker:1.5b --load ."
docker-build-7b = "docker buildx build --progress=plain --cache-from type=local,src=.buildx-cache --cache-to type=local,dest=.buildx-cache,mode=max --build-arg MODEL_ID=vibevoice-7b -t ghcr.io/dale0525/tts-docker:7b --load ."
docker-build-cosy3 = "docker buildx build --progress=plain --cache-from type=local,src=.buildx-cache --cache-to type=local,dest=.buildx-cache,mode=max --build-arg MODEL_ID=cosyvoice3-0.5b -t ghcr.io/dale0525/tts-docker:cosyvoice3-0.5b --load ."
