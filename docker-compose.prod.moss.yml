services:
  vibevoice:
    image: ghcr.io/dale0525/vibevoice-docker:moss-ttsd-v1.0
    container_name: vibevoice-moss-ttsd-v1.0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - VIBEVOICE_MODEL_ID=moss-ttsd-v1.0
      - VIBEVOICE_PRELOAD_MODEL=1
      - VIBEVOICE_WARMUP_ON_PRELOAD=true
      - VIBEVOICE_IDLE_UNLOAD_SECONDS=900
      - VIBEVOICE_MAX_LOADED_MODELS=1
      - VIBEVOICE_SCRIPT_LINE_MAX_CHARS=150
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
